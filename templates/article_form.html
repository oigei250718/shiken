{{template "header" .}}
<h1>{{.Title}}</h1>
{{if .Saved}}
<div class="alert alert-success">
  文章「<span class="jp">{{.Saved}}</span>」已保存 ✓ 可以继续录入下一篇
  <a href="/articles/{{.SavedID}}">查看详情 →</a>
</div>
{{end}}
<form class="form article-form" method="post" action="{{.Action}}" data-quick-save>
  <div class="form-row">
    <label>标题 <span class="required">*</span></label>
    <input type="text" name="title" value="{{.Article.Title}}" required placeholder="文章标题" autofocus>
  </div>
  <div class="form-row">
    <label>内容</label>
    <textarea name="content" rows="16" class="lined" data-max-height="600" wrap="off" placeholder="文章内容（支持 Markdown）...">{{.Article.Content}}</textarea>
  </div>
  <div class="form-actions">
    <button class="btn btn-primary" type="submit">保存</button>
    <span class="muted kbd-hint">⌘+Enter 快捷保存</span>
    <a class="btn" href="/articles">取消</a>
  </div>
</form>
{{template "footer" .}}
