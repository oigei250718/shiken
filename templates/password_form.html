{{template "header" .}}
<div class="page-head">
  <h1>{{.Title}}</h1>
  <a class="btn" href="/">返回首页</a>
</div>
<form class="user-form" method="post" action="/password">
  {{if .Saved}}<div class="alert alert-ok">密码修改成功</div>{{end}}
  {{if .Error}}<div class="alert alert-error">{{.Error}}</div>{{end}}
  <label>原密码<input type="password" name="old_password" autofocus></label>
  <label>新密码（至少 6 位）<input type="password" name="new_password"></label>
  <label>确认新密码<input type="password" name="confirm_password"></label>
  <div class="form-actions">
    <button class="btn btn-primary" type="submit">修改密码</button>
    <a class="btn" href="/">取消</a>
  </div>
</form>
{{template "footer" .}}
