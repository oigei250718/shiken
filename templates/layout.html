{{define "pagination"}}
{{if gt .Total 1}}
<div class="pagination">
  {{if .HasPrev}}<a class="btn" href="?q={{.Query}}{{.Extra}}&page={{sub .Current 1}}">上一页</a>{{end}}
  <span>第 {{.Current}} / {{.Total}} 页</span>
  {{if .HasNext}}<a class="btn" href="?q={{.Query}}{{.Extra}}&page={{add .Current 1}}">下一页</a>{{end}}
</div>
{{end}}
{{end}}
